    <circle cx="18" cy="6" r="7" fill="#C6FF3D" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="6" cy="18" r="7" fill="#B9CCFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="30" cy="18" r="7" fill="#B9CCFF" stroke="#1A1A1A" stroke-width="3" />
    <circle cx="18" cy="30" r="7" fill="#C6FF3D" stroke="#1A1A1A" stroke-width="3" />
