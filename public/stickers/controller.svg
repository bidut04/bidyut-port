  <path d="M205,60 C212,75 212,105 205,120" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Outer Die-Cut Controller Silhouette -->
  <path d="M50,45 C35,45 20,65 20,105 C20,135 35,160 55,160 C75,160 85,135 110,135 C135,135 145,160 165,160 C185,160 200,135 200,105 C200,65 185,45 170,45 C150,45 135,55 110,55 C85,55 70,45 50,45 Z"
