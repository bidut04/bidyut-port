<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <!-- Poster card die-cut background -->
  <rect x="8" y="8" width="224" height="264" rx="20" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="7" />
  <rect x="18" y="18" width="204" height="244" rx="14" fill="#FF6B1A" stroke="#1A1A1A" stroke-width="4" />
  
  <!-- Mini header banner -->
  <rect x="28" y="28" width="184" height="32" rx="8" fill="#1F4BFF" stroke="#1A1A1A" stroke-width="3" />
  <text x="120" y="50" font-family="'Archivo Black', sans-serif" font-size="14" fill="#C6FF3D" text-anchor="middle" letter-spacing="2">RETRO SNAP 70s</text>
  
  <!-- Camera Body -->
  <g transform="translate(30, 75)">
    <!-- Main Camera box -->
    <rect x="10" y="30" width="160" height="110" rx="18" fill="#B9CCFF" stroke="#1A1A1A" stroke-width="6" />
    <rect x="10" y="30" width="160" height="34" rx="10" fill="#1A1A1A" />
    
    <!-- Viewfinder / flash top -->
    <rect x="40" y="14" width="45" height="18" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" />
    <rect x="110" y="16" width="30" height="14" rx="4" fill="#FF6B1A" stroke="#1A1A1A" stroke-width="4" />
    <!-- Flash star -->
    <circle cx="125" cy="23" r="3" fill="#C6FF3D" />

    <!-- Lens Outer Rim -->
    <circle cx="90" cy="85" r="42" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="6" />
    <circle cx="90" cy="85" r="34" fill="#1F4BFF" stroke="#1A1A1A" stroke-width="4" />
    <circle cx="90" cy="85" r="24" fill="#1A1A1A" />
    
    <!-- Cartoon Eyes inside Lens! (70s rubber-hose retro style) -->
    <ellipse cx="82" cy="82" rx="7" ry="11" fill="#FFFFFF" />
    <ellipse cx="98" cy="82" rx="7" ry="11" fill="#FFFFFF" />
    <circle cx="84" cy="84" r="5" fill="#1A1A1A" />
    <circle cx="100" cy="84" r="5" fill="#1A1A1A" />
    <circle cx="82" cy="80" r="2" fill="#FFFFFF" />
    <circle cx="98" cy="80" r="2" fill="#FFFFFF" />
    
    <!-- Happy Smile under eyes -->
    <path d="M84,97 Q90,103 96,97" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Cheek blush -->
    <circle cx="75" cy="94" r="4" fill="#FF6B1A" />
    <circle cx="105" cy="94" r="4" fill="#FF6B1A" />
  </g>

  <!-- Bottom text badge -->
  <rect x="36" y="222" width="168" height="28" rx="14" fill="#C6FF3D" stroke="#1A1A1A" stroke-width="3" />
  <text x="120" y="241" font-family="'Archivo Black', sans-serif" font-size="12" fill="#1A1A1A" text-anchor="middle" letter-spacing="1.5">LIMITED EDITION</text>
</svg>

