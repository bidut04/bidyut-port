<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Motion streaks -->
  <path d="M40,20 L48,32 M30,40 L38,52" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  <path d="M165,150 L175,160 M175,135 L185,145" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />

  <!-- Left Bolt: Orange with Eyes -->
  <g transform="translate(15, 10)">
    <!-- White Die-Cut Background -->
    <polygon points="55,5 15,85 45,85 10,165 75,75 45,75" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <polygon points="55,15 22,85 50,85 20,155 70,80 44,80" fill="#FF6B1A" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Cartoon Eye 1 -->
    <ellipse cx="40" cy="58" rx="6" ry="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" />
    <circle cx="41" cy="58" r="3.5" fill="#1A1A1A" />
    <circle cx="39" cy="56" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Right Bolt: Electric Blue with Eyes -->
  <g transform="translate(85, 45) rotate(10 50 80)">
    <!-- White Die-Cut Background -->
    <polygon points="65,5 25,85 55,85 18,165 85,75 55,75" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" />
    <polygon points="65,15 32,85 60,85 28,155 80,80 54,80" fill="#1F4BFF" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />

    <!-- Cartoon Eyes -->
    <ellipse cx="48" cy="58" rx="6" ry="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" />
    <circle cx="49" cy="58" r="3.5" fill="#1A1A1A" />
    <circle cx="47" cy="56" r="1.5" fill="#FFFFFF" />

    <ellipse cx="62" cy="59" rx="5" ry="8" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" />
    <circle cx="63" cy="59" r="3" fill="#1A1A1A" />
    <circle cx="61" cy="57" r="1.2" fill="#FFFFFF" />
  </g>
</svg>

